<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171c20">
<title>RootLens Opening</title>
<style>
  :root {
    --bg: #171c20;
    --cyan: #22cede;
    --orange: #fe6a0c;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --unit: 0.32s; /* one draw-order step */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #e8eef0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }

  /* What sits under the opening. In the dashboard this is the app itself. */
  .under { min-height: 100%; display: grid; place-items: center; gap: 1rem; text-align: center; padding: 16px; }
  .under p { margin: 0; color: #e8eef0b3; font-size: 0.95rem; }
  .btn { font: inherit; font-size: 0.85rem; font-weight: 600; color: #e8eef0; background: #ffffff10; border: 1px solid #ffffff26; border-radius: 999px; padding: 0.6rem 1.1rem; min-height: 44px; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
  .btn:hover { background: #ffffff1c; border-color: #ffffff55; }
  .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  /* The opening itself */
  .intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: hidden; background: var(--bg); transition: opacity 0.7s ease, visibility 0.7s; }
  .intro.done { opacity: 0; visibility: hidden; }
  .glow { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(42% 40% at var(--gx, 50%) var(--gy, 42%), #22cede2e, transparent 70%); transition: opacity 1.6s ease; }
  .play .glow { opacity: 1; }
  .stage { width: min(88vw, 78vh); aspect-ratio: 1440 / 1500; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.6s var(--ease-out); }
  .intro.leaving .stage { transform: scale(0.94); opacity: 0; transition: transform 0.7s cubic-bezier(0.7, 0, 0.84, 0), opacity 0.6s ease 0.1s; }
  .stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .stage .bg { fill: none; }

  /* 1. Hexagon and roots draw from the top vertex down, branch by branch (--d = step in the draw order). */
  .draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; }
  .play .draw { animation: draw calc(var(--unit) * 2.2) var(--ease-out) calc(var(--d) * var(--unit)) forwards; }
  .play .hex .draw { animation-duration: 1.1s; }
  .play .trunk { animation-duration: 0.7s; animation-timing-function: cubic-bezier(0.5, 0, 0.2, 1); }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* 2. Each node lands when its root reaches it. */
  .node { transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(0.2); }
  .play .node { animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--d) * var(--unit) + 0.25s) forwards; }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }

  /* 3. The lens sweeps the roots; every node flickers as it passes, then the one root that matters lights orange. */
  .scan { opacity: 0; }
  .play .scan { animation: scan 0.9s cubic-bezier(0.45, 0, 0.25, 1) 2.55s forwards; }
  @keyframes scan { 0% { opacity: 0; transform: translateX(-560px); } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(560px); } }
  .play .node:not(.root) { animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--d) * var(--unit) + 0.25s) forwards, blink 0.5s ease calc(2.55s + var(--sx) * 0.9s) 1; }
  @keyframes blink { 40% { stroke: #ffffff; } }
  .node.root { stroke: var(--cyan); }
  .play .node.root { animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--d) * var(--unit) + 0.25s) forwards, ignite 0.5s ease 3.25s forwards; }
  @keyframes ignite { to { stroke: var(--orange); } }
  .pulse { fill: none; stroke: var(--orange); stroke-width: 6; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .play .pulse { animation: pulse 1.2s var(--ease-out) 3.3s 2; }
  .play .pulse + .pulse { animation-delay: 3.6s; animation-iteration-count: 1; }
  @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.4); } }

  /* 4. The wordmark rises in, left to right, then the tagline. */
  .word { clip-path: inset(0 100% 0 0); transform: translateY(26px); opacity: 0; }
  .play .word { animation: word 0.9s var(--ease-out) 3.35s forwards; }
  @keyframes word { to { clip-path: inset(0 0 0 0); transform: none; opacity: 1; } }
  .tag { font: 500 38px/1 ui-monospace, 'JetBrains Mono', Consolas, monospace; letter-spacing: 0.18em; fill: #e8eef0; opacity: 0; }
  .play .tag { animation: tag 0.8s ease 4s forwards; }
  @keyframes tag { to { opacity: 0.6; } }

  .skip { position: absolute; right: 24px; bottom: 24px; z-index: 2; font-size: 0.75rem; font-weight: 500; color: #e8eef08c; background: transparent; }
  .skip:hover, .skip:focus-visible { color: #e8eef0; }
  .intro.leaving .skip { opacity: 0; }

  /* Reduced motion: the finished logo, briefly, no drawing. */
  @media (prefers-reduced-motion: reduce) {
    .draw { stroke-dashoffset: 0; }
    .node, .word { opacity: 1; transform: none; clip-path: none; }
    .node.root { stroke: var(--orange); }
    .tag { opacity: 0.6; }
    .play .draw, .play .node, .play .word, .play .tag, .play .scan, .play .pulse { animation: none; }
    .stage, .intro.leaving .stage { transform: none; transition: opacity 0.4s; }
  }
</style>
</head>
<body>
<!-- Opening animation for RootLens. Standalone: open this file in a browser. Idea taken from the PS2-RVITM intro
     (dark full screen, the logo builds in stages, holds, then clears to the app; skippable, pointer-reactive, reduced-motion safe),
     but drawn from the logo's own lines: the roots grow out of the trunk, the lens sweeps them and finds the one orange root. -->
<main class="under" id="under" hidden>
  <div>
    <p>This is where the dashboard loads.</p>
  </div>
  <button type="button" class="btn" id="replay">Replay opening</button>
</main>

<div class="intro" id="intro" role="img" aria-label="RootLens">
  <div class="glow" aria-hidden="true"></div>
  <div class="stage" id="stage" aria-hidden="true">
{{SVG}}
  </div>
  <button type="button" class="btn skip" id="skip">Skip intro</button>
</div>

<script>
(() => {
  const intro = document.getElementById('intro');
  const stage = document.getElementById('stage');
  const under = document.getElementById('under');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HOLD_UNTIL = reduced ? 1100 : 5600; // ms until it clears by itself
  let timers = [];

  // The sweep reaches each node at a time set by its x position, so the flicker follows the lens.
  const svg = stage.querySelector('svg');
  const vb = svg.viewBox.baseVal;
  svg.querySelectorAll('.node').forEach((n) => n.style.setProperty('--sx', ((+n.getAttribute('cx') - vb.x) / vb.width).toFixed(3)));

  const finish = () => {
    if (intro.classList.contains('leaving')) return;
    timers.forEach(clearTimeout);
    intro.classList.add('leaving');
    under.hidden = false;
    timers = [setTimeout(() => intro.classList.add('done'), reduced ? 0 : 350)];
    setTimeout(() => document.getElementById('replay').focus({ preventScroll: true }), 900);
  };

  const play = () => {
    intro.classList.remove('play', 'leaving', 'done');
    void intro.offsetWidth; // restart the CSS animations
    intro.classList.add('play');
    timers = [setTimeout(finish, HOLD_UNTIL)];
  };

  document.getElementById('skip').addEventListener('click', finish);
  document.getElementById('replay').addEventListener('click', play);
  addEventListener('keydown', (e) => { if (['Escape', 'Enter', ' '].includes(e.key) && !intro.classList.contains('leaving')) { e.preventDefault(); finish(); } });

  // The pointer tilts the mark a little and pulls the glow along.
  if (!reduced) {
    intro.addEventListener('pointermove', (e) => {
      const x = e.clientX / innerWidth - 0.5;
      const y = e.clientY / innerHeight - 0.5;
      stage.style.setProperty('--ry', `${(x * 8).toFixed(2)}deg`);
      stage.style.setProperty('--rx', `${(-y * 8).toFixed(2)}deg`);
      intro.style.setProperty('--gx', `${(50 + x * 30).toFixed(1)}%`);
      intro.style.setProperty('--gy', `${(42 + y * 30).toFixed(1)}%`);
    });
  }

  play();
})();
</script>
</body>
</html>
